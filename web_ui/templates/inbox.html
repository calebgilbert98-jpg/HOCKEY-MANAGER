<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox — Puck Dynasty</title>
<link rel="stylesheet" href="/static/css/hub.css">
<link rel="stylesheet" href="/static/css/nav.css">
<link rel="stylesheet" href="/static/css/inbox.css">
</head>
<body>
<div class="arena-bg"></div>
{% include '_nav.html' %}

<header class="topbar">
  <a class="back" href="/">← Hub</a>
  <div class="team-sub" id="inbox-count"></div>
</header>

<main class="inbox-main">
  <div class="bcast-head">
    <div class="bcast-kicker">Communications</div>
    <h1 class="bcast-title">Inbox</h1>
  </div>
  <div class="legend">
    <span><i class="dot red"></i> Action needed</span>
    <span><i class="dot gold"></i> Urgent</span>
    <span><i class="dot blue"></i> Unread</span>
  </div>
  <!-- Batch D: category pills (loaded live from /api/inbox/filters),
       search, mark-all-read -->
  <div class="inbox-toolbar">
    <div class="filters fpills" id="filters"></div>
    <div class="inbox-tools">
      <input type="text" id="inbox-search" class="nhl-input" placeholder="Search messages…">
      <button class="btn-ghost" id="btn-mark-all">Mark all read</button>
    </div>
  </div>
  <div class="msg-list" id="msg-list"></div>
</main>

<div class="reader" id="reader" hidden>
  <div class="reader-card">
    <button class="reader-close" id="reader-close">✕</button>
    <div class="reader-meta">
      <div><b>From:</b> <span id="r-from"></span></div>
      <div><b>Date:</b> <span id="r-date"></span></div>
      <div><b>Subject:</b> <span id="r-subject"></span></div>
      <div><b>Category:</b> <span id="r-category"></span></div>
    </div>
    <div class="reader-body" id="r-body"></div>
    <div class="reader-actions">
      <button id="r-flag">Save</button>
      <button id="r-important">Mark important</button>
      <button id="r-read">Mark as read</button>
      <button id="r-delete" class="danger">Delete</button>
    </div>
  </div>
</div>

<!-- Batch D: compose / reply / forward editor modal -->
<script src="/static/js/inbox.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/context_menu.js"></script>
</body>
</html>
