<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puck Dynasty</title>
<link rel="stylesheet" href="/static/css/hub.css">
<link rel="stylesheet" href="/static/css/nav.css">
</head>
<body class="th">
<div class="arena-bg"></div>
{% include '_nav.html' %}
<div class="th-loading" id="th-loading"><div class="th-spinner"></div><div>LOADING FRANCHISE…</div></div>

<header class="th-topbar">
  <button class="th-navbtn" id="btn-back" aria-label="Back">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="th-title">Puck Dynasty Tile Hub</div>
  <div class="th-menuwrap">
    <button class="th-navbtn" id="btn-menu" aria-label="Menu" aria-haspopup="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
    <div class="th-menu" id="th-menu" hidden>
      <a href="/save">Save / Load</a>
      <a href="/settings">Settings</a>
      <button id="menu-exit">Exit game</button>
    </div>
  </div>
</header>

<main class="th-wrap">
  <section class="th-franchise">
    <div class="th-franchise-left">
      <div class="th-eyebrow" id="th-season">FRANCHISE · 2026-27 SEASON</div>
      <h1 class="th-team" id="th-team">BOSTON BRUINS</h1>
    </div>
    <div class="th-franchise-right">
      <div class="th-record" id="th-record">0-0-0</div>
    </div>
  </section>
  <hr class="th-rule">

  <section class="th-hero" id="th-hero" role="button" tabindex="0" aria-label="Continue season">
    <div class="th-hero-inner">
      <div class="th-hero-text">
        <span class="th-pill"><span class="th-dot"></span>Ready to play</span>
        <h2 class="th-hero-title">CONTINUE SEASON</h2>
      </div>
      <div class="th-hero-next">
        <span class="th-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
        </span>
        <span class="th-next-text" id="th-next">Next: —</span>
      </div>
    </div>
  </section>

  <section class="th-grid" id="th-grid" aria-label="Primary"></section>

  <div class="th-more-label">MORE</div>
  <section class="th-grid th-grid-more" id="th-grid-more" aria-label="More"></section>

  <section class="th-strip" id="th-strip" aria-label="Team stats"></section>

  <section class="th-panels" id="th-panels" aria-label="At a glance">
    <div class="th-panel" id="panel-next">
      <div class="th-panel-head">Next Game</div>
      <div class="th-panel-body" id="panel-next-body"></div>
    </div>
    <div class="th-panel" id="panel-standings">
      <div class="th-panel-head" id="panel-standings-head">Division Standings</div>
      <div class="th-panel-body"><table class="th-table" id="panel-standings-table"></table></div>
    </div>
    <div class="th-panel" id="panel-leaders">
      <div class="th-panel-head">Team Leaders</div>
      <div class="th-panel-body" id="panel-leaders-body"></div>
    </div>
    <div class="th-panel" id="panel-form">
      <div class="th-panel-head">Recent Form</div>
      <div class="th-panel-body" id="panel-form-body"></div>
    </div>
  </section>
</main>

<div class="th-ticker" id="th-ticker" aria-label="League news ticker">
  <div class="th-ticker-label">PUCK DYNASTY WIRE</div>
  <div class="th-ticker-viewport"><div class="th-ticker-track" id="th-ticker-track"></div></div>
</div>

<footer class="hints">
  <span><b>Click</b> a tile to open</span>
  <span><b>Esc</b> back to hub</span>
  <button id="btn-exit" class="exit-btn" title="Save and quit Puck Dynasty">⏻ Exit</button>
</footer>

<script src="/static/js/hub.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/context_menu.js"></script>
</body>
</html>
