<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lines — Puck Dynasty</title>
<link rel="stylesheet" href="/static/css/hub.css">
<link rel="stylesheet" href="/static/css/lines.css">
</head>
<body>
<div class="arena-bg"></div>

<header class="topbar">
  <a class="back" href="/">← Hub</a>
  <div class="team-sub" id="lines-sub">Line combinations</div>
</header>

<main class="lines-main">
  <div class="lines-head">
    <h1 class="page-title">Line Combinations</h1>
    <div class="lines-actions">
      <button class="btn-new hidden" id="save-lines-btn">Save Lines</button>
      <button class="btn-ghost hidden" id="cancel-lines-btn">Cancel</button>
      <button class="btn-new" id="edit-lines-btn">Edit Lines</button>
    </div>
  </div>
  <p class="lines-note" id="lines-note">Current lines. Use Edit Lines to change them.</p>
  <div id="lines-units"></div>
  <div id="lines-editor" class="hidden"></div>

  <h2 class="lines-h2">Roster reference</h2>
  <div id="lines-roster" class="lines-roster"></div>
</main>

<script src="/static/js/lines.js"></script>
</body>
</html>
