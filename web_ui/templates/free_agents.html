<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Agents — Puck Dynasty</title>
<link rel="stylesheet" href="/static/css/hub.css">
<link rel="stylesheet" href="/static/css/free_agents.css">
</head>
<body>
<div class="arena-bg"></div>

<header class="topbar">
  <a class="back" href="/">← Hub</a>
  <div class="team-sub" id="fa-count"></div>
</header>

<main class="fa-main">
  <h1 class="page-title">Free Agents</h1>
  <p class="fa-sub">Sign players to fill roster holes. UFAs sign outright; RFAs may require offer-sheet compensation.</p>

  <div class="fa-filters">
    <div class="fa-pos-group" id="pos-filter" role="group" aria-label="Position filter">
      <button class="fa-pill active" data-pos="ALL">All</button>
      <button class="fa-pill" data-pos="C">C</button>
      <button class="fa-pill" data-pos="LW">LW</button>
      <button class="fa-pill" data-pos="RW">RW</button>
      <button class="fa-pill" data-pos="D">D</button>
      <button class="fa-pill" data-pos="G">G</button>
    </div>
    <div class="fa-type-group" id="type-filter" role="group" aria-label="Contract type filter">
      <button class="fa-pill active" data-type="ALL">UFA + RFA</button>
      <button class="fa-pill" data-type="UFA">UFA</button>
      <button class="fa-pill" data-type="RFA">RFA</button>
    </div>
    <select class="fa-sort" id="fa-sort" aria-label="Sort free agents">
      <option value="overall">Sort: Overall ↓</option>
      <option value="ask-asc">Sort: Asking price ↑</option>
      <option value="ask-desc">Sort: Asking price ↓</option>
      <option value="age">Sort: Age ↑</option>
    </select>
  </div>

  <div class="fa-list" id="fa-list"></div>
</main>

<!-- v2 contract offer modal (in-page; never a desktop window) -->
<div class="cm-overlay" id="offer-modal" hidden>
  <div class="cm-card" role="dialog" aria-modal="true" aria-labelledby="offer-title">
    <div class="cm-head">
      <div>
        <div class="cm-title" id="offer-title">Contract offer</div>
        <div class="cm-player" id="offer-player">—</div>
      </div>
      <button class="cm-close" id="offer-close" aria-label="Close">✕</button>
    </div>
    <div class="cm-ask" id="offer-ask">—</div>
    <div class="cm-field">
      <label for="offer-years">Term <span class="cm-val" id="offer-years-val">—</span></label>
      <input type="range" id="offer-years" min="1" max="6" step="1" value="4">
    </div>
    <div class="cm-field">
      <label for="offer-aav">AAV (cap hit/yr) <span class="cm-val" id="offer-aav-val">—</span></label>
      <div class="cm-stepper">
        <button class="cm-step" id="offer-aav-down" aria-label="Decrease AAV">−</button>
        <input type="text" id="offer-aav" inputmode="numeric" value="">
        <button class="cm-step" id="offer-aav-up" aria-label="Increase AAV">+</button>
      </div>
      <div class="cm-hint" id="offer-aav-hint">—</div>
    </div>
    <div class="cm-cap" id="offer-cap">—</div>
    <div class="cm-note" id="offer-note"></div>
    <div class="cm-actions">
      <button class="cm-cancel" id="offer-cancel">Cancel</button>
      <button class="cm-submit" id="offer-submit" disabled>Sign</button>
    </div>
  </div>
</div>

<!-- v3 multi-day negotiation modal (in-page; never a desktop window) -->
<div class="cm-overlay" id="neg-modal" hidden>
  <div class="cm-card" role="dialog" aria-modal="true" aria-labelledby="neg-title">
    <div class="cm-head">
      <div>
        <div class="cm-title" id="neg-title">Contract negotiation</div>
        <div class="cm-player" id="neg-player">—</div>
      </div>
      <button class="cm-close" id="neg-close" aria-label="Close">✕</button>
    </div>
    <div class="cm-ask" id="neg-ask">—</div>
    <div class="neg-thread" id="neg-thread"></div>
    <div class="cm-field" id="neg-counter-fields" hidden>
      <label for="neg-years">Your counter — term <span class="cm-val" id="neg-years-val">—</span></label>
      <input type="range" id="neg-years" min="1" max="7" step="1" value="4">
      <label for="neg-aav" style="margin-top:10px">Your counter — AAV <span class="cm-val" id="neg-aav-val">—</span></label>
      <div class="cm-stepper">
        <button class="cm-step" id="neg-aav-down" aria-label="Decrease AAV">−</button>
        <input type="text" id="neg-aav" inputmode="numeric" value="">
        <button class="cm-step" id="neg-aav-up" aria-label="Increase AAV">+</button>
      </div>
      <div class="cm-hint">Server re-validates terms (league min/max, term, cap) before sending.</div>
    </div>
    <div class="cm-note" id="neg-note"></div>
    <div class="cm-actions">
      <button class="cm-cancel" id="neg-walk">Walk away</button>
      <button class="cm-cancel" id="neg-counter">Counter</button>
      <button class="cm-submit" id="neg-accept">Accept</button>
    </div>
  </div>
</div>

<script src="/static/js/free_agents.js"></script>
</body>
</html>
