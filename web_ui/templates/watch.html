<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch Game — Puck Dynasty</title>
<link rel="stylesheet" href="/static/css/hub.css">
<link rel="stylesheet" href="/static/css/nav.css">
<link rel="stylesheet" href="/static/css/watch.css">
</head>
<body>
<div class="watch-wrap">
  <header class="watch-bar">
    <a class="back" href="/">← Hub</a>
    <div class="scorebug" id="scorebug">
      <span class="sb-team home" id="sb-home-abbr">···</span>
      <span class="sb-score" id="sb-home">0</span>
      <span class="sb-mid">
        <span class="sb-period" id="sb-period">P1</span>
        <span class="sb-clock" id="sb-clock">20:00</span>
      </span>
      <span class="sb-score" id="sb-away">0</span>
      <span class="sb-team away" id="sb-away-abbr">···</span>
    </div>
    <div class="watch-controls">
      <button id="btn-pause" title="Pause / resume (Space)" aria-label="Pause or resume">⏸</button>
      <button id="btn-speed" title="Playback speed" aria-label="Playback speed">1×</button>
      <button id="btn-cam" title="Follow cam (C for full rink)" aria-label="Camera mode">🎥</button>
      <button id="btn-stats" title="Stats overlay" aria-label="Stats overlay">📊</button>
    </div>
  </header>
  <nav class="watch-modes" aria-label="Watch modes">
    <button class="wm-tab active" data-mode="visual" title="Live visualizer">📺 Visualizer</button>
    <button class="wm-tab" data-mode="text" title="Play-by-play text feed">📝 Text</button>
    <button class="wm-tab" data-mode="chart" title="Shot chart from the event log">🎯 Shot Chart</button>
    <button class="wm-tab" data-mode="box" title="Box score — click a player for their profile">📊 Box Score</button>
  </nav>
  <div class="rink-stage" id="pane-visual">
    <canvas id="rink"></canvas>
    <div class="stats-overlay hidden" id="stats-overlay" aria-live="polite"></div>
    <div class="event-ticker" id="event-ticker" aria-live="polite"></div>
  </div>
  <section class="mode-pane hidden" id="pane-text" aria-label="Play-by-play">
    <div class="text-feed" id="text-feed"></div>
  </section>
  <section class="mode-pane hidden" id="pane-chart" aria-label="Shot chart">
    <div class="chart-layout">
      <div class="chart-rink-wrap"><canvas id="shotchart"></canvas></div>
      <aside class="chart-side">
        <div class="chart-legend" id="chart-legend"></div>
        <div class="chart-detail" id="chart-detail">
          <div class="cd-empty">Click any shot marker for the play details.</div>
        </div>
      </aside>
    </div>
  </section>
  <section class="mode-pane hidden" id="pane-box" aria-label="Box score">
    <div class="boxscore" id="boxscore"></div>
  </section>
  <footer class="watch-statusbar">
    <span class="ws-live" id="ws-live"><span class="ws-dot"></span>LIVE</span>
    <span class="ws-game" id="ws-game">—</span>
    <span class="ws-hint">Click player to follow · Hover for name · C toggles camera · Space pauses</span>
  </footer>
</div>
<script src="/static/js/watch.js"></script>
<script src="/static/js/watch_modes.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/context_menu.js"></script>
</body>
</html>
