<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save / Load — Puck Dynasty</title>
<link rel="stylesheet" href="/static/css/hub.css">
<link rel="stylesheet" href="/static/css/nav.css">
<link rel="stylesheet" href="/static/css/save.css">
</head>
<body>
<div class="arena-bg"></div>
{% include '_nav.html' %}

<header class="topbar">
  <a class="back" href="/">← Hub</a>
</header>

<main class="save-main">
  <div class="bcast-head">
    <div class="bcast-kicker">Franchise File</div>
    <h1 class="bcast-title">Save / Load</h1>
  </div>

  <section class="save-panel">
    <div class="panel-label">Current game</div>
    <div class="save-meta" id="save-meta">
      <div class="save-row"><span>Team</span><b id="save-team">—</b></div>
      <div class="save-row"><span>In-game date</span><b id="save-date">—</b></div>
      <div class="save-row"><span>Autosave</span><b id="save-auto">—</b></div>
    </div>
    <div class="save-action-row">
      <input type="text" id="save-name" class="nhl-input save-name-input"
             placeholder="Save name (optional — leave blank for auto name)"
             maxlength="48" aria-label="Save name">
      <button class="btn-primary" id="btn-save">Save game</button>
    </div>
    <p class="save-status" id="save-status"></p>
  </section>

  <section class="save-panel">
    <div class="panel-label">Saved games <span class="save-count" id="save-count"></span></div>
    <div class="save-table-wrap">
      <table class="save-table" id="save-table">
        <thead>
          <tr>
            <th>Save</th>
            <th>Team</th>
            <th>Game date</th>
            <th>Modified</th>
            <th>Size</th>
            <th>Type</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="save-rows">
          <tr><td colspan="7" class="empty-note">Loading saves…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script src="/static/js/save.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/context_menu.js"></script>
</body>
</html>
