name: Windows Smoke Test

# Launches the built game on a real Windows runner, screenshots the
# launcher and hub, and uploads the images. This is our eyes on Windows:
# it catches "doesn't launch", crashes, and visual regressions (like the
# empty tile grid) before the user has to.
#
# Runs on every push to main, in parallel with the release build.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller puck_dynasty.spec --noconfirm

      - name: Launch game
        shell: powershell
        run: |
          $exe = "dist\PuckDynasty\PuckDynasty.exe"
          if (-not (Test-Path $exe)) { Write-Error "exe not found: $exe"; exit 1 }
          Start-Process -FilePath $exe
          Write-Host "Launched, waiting for web server..."

      - name: Wait for server + keepalive
        shell: powershell
        run: |
          # Start a background keepalive so the heartbeat timeout never
          # kills the game mid-test (headless screenshots don't heartbeat).
          $job = Start-Job -ScriptBlock {
            while ($true) {
              try {
                Invoke-WebRequest -Uri "http://localhost:5050/api/heartbeat" `
                  -Method POST -UseBasicParsing -TimeoutSec 5 | Out-Null
              } catch {}
              Start-Sleep -Seconds 25
            }
          }
          $job | Export-Clixml -Path "$env:TEMP\keepalive.xml"

          # Wait up to 3 minutes for the server to answer.
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:5050/api/health" `
                -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            Write-Error "FAIL: game did not start a web server in 3 minutes"
            Get-Process -Name "PuckDynasty" -ErrorAction SilentlyContinue |
              Select-Object Id, ProcessName, HasExited
            exit 1
          }
          Write-Host "PASS: server is up"

          # Fail if the game process died.
          $p = Get-Process -Name "PuckDynasty" -ErrorAction SilentlyContinue
          if (-not $p -or $p.HasExited) {
            Write-Error "FAIL: game process is not running"
            exit 1
          }
          Write-Host "PASS: game process alive (PID $($p.Id))"

      - name: Screenshot launcher
        shell: powershell
        run: |
          $edge = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edge)) {
            $edge = "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          }
          & $edge --headless --disable-gpu --no-sandbox `
            --screenshot="$env:TEMP\shot-setup.png" `
            --window-size=1600,950 http://localhost:5050/setup
          Write-Host "launcher screenshot taken"

      - name: Complete setup (new career)
        shell: powershell
        run: |
          $body = @{ mode = "new"; team = "Boston Bruins"; gm_name = "Smoke Test" } |
            ConvertTo-Json
          Invoke-WebRequest -Uri "http://localhost:5050/api/setup" `
            -Method POST -Body $body -ContentType "application/json" `
            -UseBasicParsing | Out-Null
          Write-Host "setup requested, polling for readiness..."

          $ready = $false
          for ($i = 0; $i -lt 120; $i++) {  # up to 20 minutes for league gen
            try {
              $s = Invoke-WebRequest -Uri "http://localhost:5050/api/setup_status" `
                -UseBasicParsing -TimeoutSec 5 | ConvertFrom-Json
              Write-Host "  status: $($s.status) - $($s.detail)"
              if ($s.status -eq "ready" -and $s.game_ready) { $ready = $true; break }
              if ($s.status -eq "error") {
                Write-Error "FAIL: setup errored: $($s.detail)"
                exit 1
              }
            } catch { Write-Host "  (poll failed, retrying)" }
            Start-Sleep -Seconds 10
          }
          if (-not $ready) { Write-Error "FAIL: setup never became ready"; exit 1 }
          Write-Host "PASS: game ready"

      - name: Screenshot hub
        shell: powershell
        run: |
          $edge = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edge)) {
            $edge = "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          }
          Start-Sleep -Seconds 3  # let tiles render
          & $edge --headless --disable-gpu --no-sandbox `
            --screenshot="$env:TEMP\shot-hub.png" `
            --window-size=1600,950 http://localhost:5050/
          Write-Host "hub screenshot taken"

          # Sanity: the hub API must return tiles (regression: empty grid).
          $s = Invoke-WebRequest -Uri "http://localhost:5050/api/state" `
            -UseBasicParsing -TimeoutSec 10 | ConvertFrom-Json
          $n = @($s.tiles).Count
          Write-Host "hub tiles: $n"
          if ($n -lt 5) { Write-Error "FAIL: hub returned only $n tiles"; exit 1 }
          Write-Host "PASS: hub has tiles"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-screenshots
          path: |
            ${{ env.TEMP }}\shot-setup.png
            ${{ env.TEMP }}\shot-hub.png
          if-no-files-found: warn

      - name: Shut down game
        if: always()
        shell: powershell
        run: |
          try {
            Invoke-WebRequest -Uri "http://localhost:5050/api/exit" `
              -Method POST -UseBasicParsing -TimeoutSec 5 | Out-Null
            Start-Sleep -Seconds 5
          } catch {}
          $p = Get-Process -Name "PuckDynasty" -ErrorAction SilentlyContinue
          if ($p -and -not $p.HasExited) {
            Stop-Process -InputObject $p -Force
            Write-Host "force-killed remaining game process"
          } else {
            Write-Host "game exited cleanly"
          }
