name: Build Puck Dynasty Native

# Native Qt build for the Steam-target application.
# Triggers on push to native-ui branch.
#
# Pipeline: build -> zip -> VALIDATE -> upload -> release -> discord.
# If validation fails, no artifact is uploaded and no release is created.

on:
  push:
    branches: [native-ui]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-ui

      - name: Read version
        id: version
        shell: bash
        run: echo "APP_VERSION=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller Pillow
          python -c "from PySide6.QtWidgets import QApplication; print('PySide6 OK')"

      - name: Build native with PyInstaller
        run: pyinstaller puck_dynasty_native.spec --noconfirm

      - name: Zip the build
        run: |
          cd dist
          Compress-Archive -Path PuckDynasty -DestinationPath "PuckDynasty-Native-v${{ steps.version.outputs.APP_VERSION }}-Windows.zip"

      - name: Validate bundle
        # Catches the v0.26.25-28 missing-modules bug BEFORE any release is cut.
        # If this step fails, the workflow stops: no upload, no release, no Discord post.
        shell: bash
        run: |
          python - << 'PYEOF'
          import os, sys, zipfile, shutil

          version = "${{ steps.version.outputs.APP_VERSION }}"
          zip_path = f"dist/PuckDynasty-Native-v{version}-Windows.zip"
          tmp_dir = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "bundle_check")
          MIN_SCREENS = 60

          print(f"Validating {zip_path}...")

          # 1. Extract
          if os.path.exists(tmp_dir):
              shutil.rmtree(tmp_dir)
          os.makedirs(tmp_dir)
          with zipfile.ZipFile(zip_path) as z:
              z.extractall(tmp_dir)
          print("  [ok] zip extracts cleanly")

          # 2. Find exe, check size > 5MB
          exe_path = None
          for root, dirs, files in os.walk(tmp_dir):
              if "PuckDynasty.exe" in files:
                  exe_path = os.path.join(root, "PuckDynasty.exe")
                  break
          if not exe_path:
              print("::error::VALIDATION FAILED: PuckDynasty.exe not found in bundle")
              sys.exit(1)
          size_mb = os.path.getsize(exe_path) / (1024 * 1024)
          if size_mb < 5:
              print(f"::error::VALIDATION FAILED: PuckDynasty.exe too small "
                    f"({size_mb:.1f} MB, need > 5MB)")
              sys.exit(1)
          print(f"  [ok] PuckDynasty.exe found ({size_mb:.1f} MB)")

          # 3. Find _internal
          internal = None
          bundle_root = None
          for root, dirs, files in os.walk(tmp_dir):
              if "_internal" in dirs:
                  internal = os.path.join(root, "_internal")
                  bundle_root = root
                  break
          if not internal:
              print("::error::VALIDATION FAILED: _internal folder missing "
                    "-- PyInstaller bundle is malformed")
              sys.exit(1)
          print("  [ok] _internal folder present")

          # 4. Count bundled screen modules.
          # Expected list comes from the source tree (what SHOULD be bundled).
          screens_dir = "native_ui/screens"
          expected = [f[:-3] for f in os.listdir(screens_dir)
                      if f.endswith(".py") and f != "__init__.py"]
          print(f"  Expecting {len(expected)} screen modules from source")

          found = set()

          # Check A: _internal/native_ui/screens/ as loose .pyc/.py files
          bundled_dir = os.path.join(internal, "native_ui", "screens")
          if os.path.isdir(bundled_dir):
              for f in os.listdir(bundled_dir):
                  if f.endswith((".pyc", ".py")):
                      name = f.rsplit(".", 1)[0]
                      if name in expected:
                          found.add(name)
              print(f"  Found {len(found)} via _internal/native_ui/screens/ directory")

          # Check B: byte-string search across the bundle (catches PYZ-embedded
          # modules and exe-embedded archives). Read each file once.
          if len(found) < MIN_SCREENS:
              needles = {}
              for s in expected:
                  if s not in found:
                      needles[s] = (
                          f"native_ui.screens.{s}".encode(),
                          f"native_ui/screens/{s}".encode(),
                          f"native_ui\\screens\\{s}".encode(),
                      )
              # Search _internal plus the exe itself (modules can be embedded there)
              search_roots = [internal]
              if exe_path:
                  search_roots.append(os.path.dirname(exe_path))
              seen_files = set()
              for search_root in search_roots:
                  for root, dirs, files in os.walk(search_root):
                      if not needles:
                          break
                      for f in files:
                          if not needles:
                              break
                          fp = os.path.join(root, f)
                          if fp in seen_files:
                              continue
                          seen_files.add(fp)
                          try:
                              # Skip enormous binaries for speed; module names
                              # live in the PYZ/pyc data, not in 100MB+ DLLs.
                              if os.path.getsize(fp) > 100 * 1024 * 1024:
                                  continue
                              with open(fp, "rb") as fh:
                                  data = fh.read()
                          except (OSError, IOError):
                              continue
                          for s in list(needles.keys()):
                              if any(v in data for v in needles[s]):
                                  found.add(s)
                                  del needles[s]
              print(f"  Found {len(found)} total after byte-string search")

          if len(found) < MIN_SCREENS:
              missing = sorted(set(expected) - found)
              shown = ", ".join(missing[:10]) + ("..." if len(missing) > 10 else "")
              print(f"::error::VALIDATION FAILED: only {len(found)} screen modules "
                    f"bundled (need >= {MIN_SCREENS}). Missing: {shown}. "
                    f"This is the missing-modules bug: check puck_dynasty_native.spec "
                    f"hiddenimports actually collects native_ui.screens.*")
              sys.exit(1)
          print(f"  [ok] screen module count OK ({len(found)} >= {MIN_SCREENS})")
          print("Bundle validation passed.")
          PYEOF

      - name: Windows smoke test
        # Launches the built exe on real Windows to catch startup crashes
        # (e.g. the v0.26.30 draft/morale ModuleNotFoundError).
        # Runs the Python source directly with console enabled so tracebacks
        # are visible, plus a brief launch of the bundled exe.
        # A failure here blocks the release.
        shell: bash
        run: |
          python - << 'PYEOF'
          import os, subprocess, sys, time

          version = "${{ steps.version.outputs.APP_VERSION }}"
          print(f"Windows smoke test for v{version}...")

          # Test 1: Import all screen modules via the source tree.
          # Catches ModuleNotFoundError / ImportError before bundling.
          print("  Test 1: importing all screen modules from source...")
          r = subprocess.run(
              [sys.executable, "-c",
               "import native_ui.main_window; "
               "import inspect; "
               "src = inspect.getsource(native_ui.main_window.MainWindow._register_all_screens); "
               "imports = [l.strip() for l in src.splitlines() if l.strip().startswith('from native_ui.screens.')]; "
               "print(f'Found {len(imports)} static screen imports'); "
               "mods = {}; "
               "exec(compile('from native_ui.screens import ' + ','.join([]) , '<s>', 'exec'), mods); "
               ],
              capture_output=True, text=True, timeout=120,
              env={**os.environ, "QT_QPA_PLATFORM": "offscreen"},
          )
          # Simpler: just try importing each screen file directly
          import pathlib
          screens_dir = pathlib.Path("native_ui/screens")
          failures = []
          for f in sorted(screens_dir.glob("*.py")):
              if f.name == "__init__.py":
                  continue
              mod = f"native_ui.screens.{f.stem}"
              r = subprocess.run(
                  [sys.executable, "-c", f"import {mod}"],
                  capture_output=True, text=True, timeout=60,
                  env={**os.environ, "QT_QPA_PLATFORM": "offscreen"},
              )
              if r.returncode != 0:
                  err = (r.stderr or r.stdout or "")[:500]
                  failures.append(f"{mod}: {err}")
          if failures:
              print(f"::error::SMOKE TEST FAILED: {len(failures)} screen modules failed to import:")
              for f in failures[:10]:
                  print(f"::error::  {f}")
              sys.exit(1)
          print(f"  [ok] all screen modules import cleanly from source")

          # Test 2: Instantiate the main window offscreen.
          # Catches _register_all_screens crashes (the v0.26.30 bug).
          print("  Test 2: instantiating MainWindow offscreen...")
          test_code = (
              "import os; os.environ['QT_QPA_PLATFORM'] = 'offscreen'; "
              "from PySide6.QtWidgets import QApplication; "
              "app = QApplication([]); "
              "from native_ui.main_window import MainWindow; "
              "w = MainWindow(); "
              "print(f'MainWindow OK, {len(w._screens)} screens registered'); "
          )
          r = subprocess.run(
              [sys.executable, "-c", test_code],
              capture_output=True, text=True, timeout=180,
              env={**os.environ, "QT_QPA_PLATFORM": "offscreen"},
          )
          if r.returncode != 0:
              err = (r.stderr or r.stdout or "")[-2000:]
              print(f"::error::SMOKE TEST FAILED: MainWindow instantiation crashed:")
              print(f"::error::{err}")
              sys.exit(1)
          print(f"  [ok] {r.stdout.strip().splitlines()[-1] if r.stdout.strip() else 'MainWindow instantiated'}")

          # Test 3: Brief launch of the bundled exe.
          # With console=False we can't see tracebacks, but a non-zero
          # exit within 15s means a startup crash.
          print("  Test 3: launching bundled PuckDynasty.exe briefly...")
          import zipfile, shutil, glob
          zip_path = f"dist/PuckDynasty-Native-v{version}-Windows.zip"
          tmp = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "smoke_exe")
          if os.path.exists(tmp):
              shutil.rmtree(tmp)
          os.makedirs(tmp)
          with zipfile.ZipFile(zip_path) as z:
              z.extractall(tmp)
          exe = None
          for root, dirs, files in os.walk(tmp):
              if "PuckDynasty.exe" in files:
                  exe = os.path.join(root, "PuckDynasty.exe")
                  break
          if not exe:
              print("::error::SMOKE TEST FAILED: exe not found for launch test")
              sys.exit(1)
          try:
              p = subprocess.Popen(
                  [exe],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  env={**os.environ, "QT_QPA_PLATFORM": "offscreen"},
              )
              try:
                  # Give it 20s: long enough to crash on missing modules,
                  # short enough to not hang the workflow.
                  outs, errs = p.communicate(timeout=20)
                  # If it exited quickly with non-zero, that's a crash.
                  if p.returncode != 0:
                      err = (errs.decode("utf-8", "replace") or outs.decode("utf-8", "replace") or "")[-1500:]
                      print(f"::error::SMOKE TEST FAILED: exe exited with code {p.returncode} within 20s")
                      if err.strip():
                          print(f"::error::{err}")
                      sys.exit(1)
                  print(f"  [ok] exe ran 20s without crashing (exit 0 or still running is fine)")
              except subprocess.TimeoutExpired:
                  # Still running after 20s = didn't crash on startup. Good.
                  print("  [ok] exe still running after 20s (no startup crash)")
              finally:
                  p.kill()
                  try:
                      p.wait(timeout=10)
                  except Exception:
                      pass
          except Exception as e:
              print(f"::error::SMOKE TEST FAILED: could not launch exe: {e}")
              sys.exit(1)

          print("Windows smoke test passed.")
          PYEOF

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PuckDynasty-Native-v${{ steps.version.outputs.APP_VERSION }}-Windows
          path: dist/PuckDynasty-Native-v${{ steps.version.outputs.APP_VERSION }}-Windows.zip

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: native-v${{ steps.version.outputs.APP_VERSION }}
          name: Puck Dynasty Native v${{ steps.version.outputs.APP_VERSION }}
          body: |
            Native Qt build (Steam target). No browser, no extensions.
            Direct Python calls -- no HTTP overhead.
          files: dist/PuckDynasty-Native-v${{ steps.version.outputs.APP_VERSION }}-Windows.zip
          draft: false
          prerelease: false

      - name: Post to Discord
        # Announces the release in the Quickmuck #dev-updates forum:
        # - the "Releases" thread ALWAYS gets the release announcement;
        # - the "Gameplay mechanics log", "Playtest results", and
        #   "UI Screenshots" threads get per-release commit summaries when
        #   the commits since the previous release tag match their keywords
        #   (a thread with no matching commits is skipped -- never an empty post).
        # Uses the DISCORD_BOT_TOKEN repo secret -- never hardcode the token.
        # A Discord outage must not fail the release, so failures warn only.
        if: success()
        shell: bash
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python - << 'PYEOF'
          import json
          import os
          import subprocess
          import urllib.request
          import urllib.error

          token = os.environ.get("DISCORD_BOT_TOKEN", "").strip()
          if not token:
              print("::warning::DISCORD_BOT_TOKEN secret not set -- skipping Discord post")
              raise SystemExit(0)

          version = "${{ steps.version.outputs.APP_VERSION }}"

          # Quickmuck #dev-updates forum threads.
          THREADS = {
              "releases": "1557519153404055593",  # Releases
              "gameplay": "1557494907105443873",  # Gameplay mechanics log
              "playtest": "1557494914927824898",  # Playtest results
              "ui":       "1557494927116476526",  # UI Screenshots
          }

          # Keyword -> thread key (case-insensitive substring match).
          # One commit can land in more than one bucket.
          CATEGORIES = {
              "ui":       ["ui", "hub", "screen", "launcher", "panel", "theme",
                           "visual"],
              "gameplay": ["sim", "blocker", "roster", "trade", "ai", "exploit",
                           "mechanic", "gameplay"],
              "playtest": ["bot", "playtest", "730", "sim run"],
          }
          CATEGORY_LABELS = {
              "ui": "UI",
              "gameplay": "Gameplay",
              "playtest": "Playtest",
          }

          def discord_post(thread_id, content):
              """Post one message; warn (never fail the workflow) on errors."""
              payload = json.dumps({"content": content[:2000]}).encode("utf-8")
              req = urllib.request.Request(
                  f"https://discord.com/api/v10/channels/{thread_id}/messages",
                  data=payload,
                  headers={
                      "Authorization": f"Bot {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "PuckDynastyBot/1.0",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      result = json.load(resp)
                      print(f"Posted to thread {thread_id}: "
                            f"message id={result.get('id')}")
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode("utf-8", "replace")[:500]
                  print(f"::warning::Discord post to {thread_id} failed: "
                        f"HTTP {e.code}: {err_body}")
              except Exception as e:
                  print(f"::warning::Discord post to {thread_id} failed: {e}")

          def run_git(args):
              try:
                  return subprocess.run(
                      ["git"] + args,
                      capture_output=True, text=True, timeout=120,
                  )
              except Exception as e:
                  print(f"::warning::git {' '.join(args)} failed: {e}")
                  return None

          # 1. The Releases thread always gets the announcement.
          discord_post(
              THREADS["releases"],
              f"v{version} is live! "
              f"Download: https://github.com/calebgilbert98-jpg/HOCKEY-MANAGER"
              f"/releases/tag/native-v{version}",
          )

          # 2. Collect commits since the previous release tag.
          # actions/checkout is shallow by default, so unshallow first.
          r = run_git(["rev-parse", "--is-shallow-repository"])
          if r is not None and r.returncode == 0 and r.stdout.strip() == "true":
              run_git(["fetch", "--unshallow", "--tags", "--quiet"])
          else:
              run_git(["fetch", "--tags", "--quiet"])

          prev_tag = None
          r = run_git(["tag", "--list", "native-v*", "--sort=-v:refname"])
          if r is not None and r.returncode == 0:
              tags = [t.strip() for t in r.stdout.splitlines() if t.strip()]
              cur = f"native-v{version}"
              if cur in tags:
                  idx = tags.index(cur)
                  if idx + 1 < len(tags):
                      prev_tag = tags[idx + 1]
              elif tags:
                  # Current tag not visible yet (fetch race); use the newest
                  # visible tag as the baseline.
                  prev_tag = tags[0]
                  print(f"::warning::{cur} not in tag list; using {prev_tag} "
                        f"as previous-release baseline")

          commits = []
          if prev_tag:
              r = run_git(["log", f"{prev_tag}..HEAD", "--oneline",
                           "--no-decorate"])
              if r is not None and r.returncode == 0:
                  commits = [c.strip() for c in r.stdout.splitlines()
                             if c.strip()]
              print(f"Found {len(commits)} commits since {prev_tag}")
          else:
              print("::warning::Could not determine previous release tag -- "
                    "skipping categorized thread posts")

          # 3. Bucket commits by keyword; post a summary per matching thread.
          buckets = {key: [] for key in CATEGORIES}
          for commit in commits:
              lowered = commit.lower()
              for key, keywords in CATEGORIES.items():
                  if any(kw in lowered for kw in keywords):
                      buckets[key].append(commit)

          for key in ("ui", "gameplay", "playtest"):
              items = buckets[key]
              if not items:
                  continue  # nothing relevant: skip the thread entirely
              label = CATEGORY_LABELS[key]
              lines = ([f"v{version} {label} updates:"]
                       + [f"- {c}" for c in items])
              discord_post(THREADS[key], "\n".join(lines))

          print("Discord posting complete.")
          PYEOF
