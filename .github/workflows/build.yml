name: Build Puck Dynasty

# Packages whatever is on main at push time. Adding new .py files, images,
# or icons requires zero workflow changes -- PyInstaller auto-discovers
# modules and the spec bundles the asset folders.

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual "Run workflow" button as well

permissions:
  contents: write  # needed to create GitHub Releases

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "APP_VERSION=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -c "import PIL; print('Pillow', PIL.__version__)" 

      - name: Build with PyInstaller
        run: pyinstaller puck_dynasty.spec --noconfirm

      - name: Zip the build
        run: |
          cd dist
          Compress-Archive -Path PuckDynasty -DestinationPath "PuckDynasty-v${{ steps.version.outputs.APP_VERSION }}-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PuckDynasty-v${{ steps.version.outputs.APP_VERSION }}-Windows
          path: dist/PuckDynasty-v${{ steps.version.outputs.APP_VERSION }}-Windows.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.APP_VERSION }}
          name: Puck Dynasty v${{ steps.version.outputs.APP_VERSION }}
          files: dist/PuckDynasty-v${{ steps.version.outputs.APP_VERSION }}-Windows.zip
          fail_on_unmatched_files: true
