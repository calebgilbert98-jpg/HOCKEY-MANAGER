name: Build Puck Dynasty

# Packages whatever is on main at push time. Adding new .py files, images,
# or icons requires zero workflow changes -- PyInstaller auto-discovers
# modules and the spec bundles the asset folders.

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual "Run workflow" button as well

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller puck_dynasty.spec --noconfirm

      - name: Zip the build
        run: |
          cd dist
          Compress-Archive -Path PuckDynasty -DestinationPath PuckDynasty-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PuckDynasty-Windows
          path: dist/PuckDynasty-Windows.zip
