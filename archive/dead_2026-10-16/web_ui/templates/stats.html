<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League Leaders — Puck Dynasty</title>
<link rel="stylesheet" href="/static/css/hub.css">
<link rel="stylesheet" href="/static/css/nav.css">
<link rel="stylesheet" href="/static/css/stats.css">
</head>
<body>
<div class="arena-bg"></div>
{% include '_nav.html' %}

<header class="topbar">
  <a class="back" href="/">← Hub</a>
  <div class="team-sub" id="stats-sub"></div>
</header>

<main class="stats-main">
  <div class="bcast-head">
    <div class="bcast-kicker">League</div>
    <h1 class="bcast-title">Stats Center</h1>
  </div>
  <nav class="stats-tabs" aria-label="Stats sections">
    <button class="st-tab active" data-tab="nhl">🏆 NHL Leaders</button>
    <button class="st-tab" data-tab="ahl">🚜 AHL</button>
    <button class="st-tab" data-tab="records">📜 Records</button>
    <button class="st-tab" data-tab="nhlrecords">⭐ NHL Records</button>
    <button class="st-tab" data-tab="xg">📈 xG Analytics</button>
  </nav>

  <div class="stats-pane" id="pane-nhl">
    <!-- Leader sub-tabs (desktop stats_standings_window.py LEADER_TABS) -->
    <nav class="leader-tabs" id="leader-tabs" aria-label="Leader boards">
      <button class="lt-tab active" data-ltab="scoring">Scoring</button>
      <button class="lt-tab" data-ltab="advanced">Advanced</button>
      <button class="lt-tab" data-ltab="goaltending">Goaltending</button>
      <button class="lt-tab" data-ltab="breakout">Breakout</button>
      <button class="lt-tab" data-ltab="rookies">Rookies</button>
      <button class="lt-tab" data-ltab="awards">Award Races</button>
      <button class="lt-tab" data-ltab="milestones">Milestones</button>
    </nav>
    <!-- Global filters -->
    <div class="leader-filters">
      <div class="lf-group">
        <span class="lf-label">Pos</span>
        <div class="tb-pills" id="lf-pos">
          <button class="tb-pill active" data-v="All">All</button>
          <button class="tb-pill" data-v="F">F</button>
          <button class="tb-pill" data-v="D">D</button>
          <button class="tb-pill" data-v="G">G</button>
        </div>
      </div>
      <div class="lf-group">
        <span class="lf-label">Min GP</span>
        <input class="lf-input" id="lf-min-gp" type="number" min="0" value="0" style="width:64px">
      </div>
      <div class="lf-group">
        <span class="lf-label">Team</span>
        <select class="lf-select" id="lf-team"><option value="All">All teams</option></select>
      </div>
    </div>
    <div class="leaders-grid" id="leaders-body"></div>
    <div id="award-race-bar" hidden>
      <div class="lf-group">
        <span class="lf-label">Award</span>
        <div class="tb-pills" id="award-pills"></div>
      </div>
      <p class="award-desc" id="award-desc"></p>
    </div>
  </div>

  <div class="stats-pane hidden" id="pane-ahl">
    <div class="leaders-grid">
      <section class="bpanel leader-card">
        <div class="bpanel-h">🏆 AHL Scoring <span class="panel-note">Top 25</span></div>
        <table class="leader-table" id="ahl-scorers"></table>
      </section>
      <section class="bpanel leader-card">
        <div class="bpanel-h">🧤 AHL Goalies <span class="panel-note">Top 15 · Min 5 GP</span></div>
        <table class="leader-table" id="ahl-goalies"></table>
      </section>
    </div>
    <section class="bpanel leader-card ahl-standings-card">
      <div class="bpanel-h">📊 AHL Standings</div>
      <table class="leader-table" id="ahl-standings"></table>
    </section>
    <p class="panel-note" style="margin-top:8px">Full AHL hub: <a href="/ahl">standings, scores, Calder Cup, teams &amp; prospects →</a></p>
  </div>

  <div class="stats-pane hidden" id="pane-records">
    <section class="bpanel leader-card">
      <div class="bpanel-h">🏆 Stanley Cup Champions</div>
      <table class="leader-table" id="champions-table"></table>
    </section>
    <div class="records-teams" id="records-teams"></div>
  </div>

  <div class="stats-pane hidden" id="pane-nhlrecords">
    <nav class="leader-tabs" id="nhlrec-tabs" aria-label="NHL record books">
      <button class="lt-tab active" data-rtab="season">Season Records</button>
      <button class="lt-tab" data-rtab="career">Career Records</button>
      <button class="lt-tab" data-rtab="team">Team Records</button>
      <button class="lt-tab" data-rtab="special">Special</button>
      <button class="lt-tab" data-rtab="chase">Record Chase</button>
      <button class="lt-tab" data-rtab="achievements">Achievements</button>
    </nav>
    <div class="bpanel leader-card">
      <div class="bpanel-h" id="nhlrec-head">⭐ NHL Records</div>
      <div id="nhlrec-body"></div>
    </div>
  </div>

  <div class="stats-pane hidden" id="pane-xg">
    <div id="xg-body"></div>
  </div>
</main>

<script src="/static/js/stats.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/context_menu.js"></script>
</body>
</html>
