<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Editor — Puck Dynasty</title>
<link rel="stylesheet" href="/static/css/hub.css">
<link rel="stylesheet" href="/static/css/nav.css">
<link rel="stylesheet" href="/static/css/lines.css">
</head>
<body>
<div class="arena-bg"></div>
{% include '_nav.html' %}

<header class="topbar">
  <a class="back" href="/">← Hub</a>
  <div class="team-sub" id="lines-sub">Line editor</div>
</header>

<main class="le-main">
  <div class="le-head bcast-head">
    <div>
      <div class="bcast-kicker">Puck Dynasty</div>
      <h1 class="bcast-title">Line Editor</h1>
      <p class="le-note" id="lines-note">Drag players onto the ice — or tap a player, then tap a slot.</p>
    </div>
    <div class="le-toolbar" id="le-toolbar">
      <button class="btn-ghost" id="btn-autobest" title="Fill this tab with the best available players">Auto Best</button>
      <button class="btn-ghost" id="btn-clear" title="Empty this tab's slots">Clear</button>
      <button class="btn-ghost" id="btn-cancel" title="Revert unsaved changes">Cancel</button>
      <button class="btn-primary" id="btn-save" disabled>Save</button>
    </div>
  </div>

  <div class="le-tabs" role="tablist" id="le-tabs">
    <button class="le-tab on" data-tab="overview" role="tab" aria-selected="true">Overview</button>
    <button class="le-tab" data-tab="line1" role="tab" aria-selected="false">Line 1</button>
    <button class="le-tab" data-tab="line2" role="tab" aria-selected="false">Line 2</button>
    <button class="le-tab" data-tab="line3" role="tab" aria-selected="false">Line 3</button>
    <button class="le-tab" data-tab="line4" role="tab" aria-selected="false">Line 4</button>
    <button class="le-tab" data-tab="pp1" role="tab" aria-selected="false">PP1</button>
    <button class="le-tab" data-tab="pp2" role="tab" aria-selected="false">PP2</button>
    <button class="le-tab" data-tab="pk1" role="tab" aria-selected="false">PK1</button>
    <button class="le-tab" data-tab="pk2" role="tab" aria-selected="false">PK2</button>
  </div>

  <div class="le-grid" id="le-grid">
    <aside class="le-roster bpanel" id="roster-panel">
      <div class="le-roster-tools">
        <input id="roster-search" class="nhl-input" type="search" placeholder="Search players…" autocomplete="off" aria-label="Search players">
        <div class="le-filters fpills">
          <button class="le-filter on" data-f="ALL">All</button>
          <button class="le-filter" data-f="F">F</button>
          <button class="le-filter" data-f="D">D</button>
          <button class="le-filter" data-f="G">G</button>
          <button class="le-filter" data-f="HOT" title="Players on a 3+ game point streak">🔥</button>
          <button class="le-filter" data-f="COLD" title="Scoreless drought">❄️</button>
        </div>
        <div class="le-sort-row">
          <label for="roster-sort">Sort</label>
          <select id="roster-sort" class="nhl-input">
            <option value="ovr">Overall</option>
            <option value="pts">Points</option>
            <option value="hot">Hot streak</option>
            <option value="age">Age (youngest)</option>
            <option value="name">Name</option>
          </select>
        </div>
      </div>
      <div class="le-roster-count" id="roster-count"></div>
      <div class="le-roster-list" id="roster-list" aria-label="Roster — drop here to remove a player from the lines"></div>
      <div class="le-roster-hint">Drag a dressed player back here to remove them from the lines.</div>
    </aside>

    <div class="le-tabwrap">
      <div id="tab-content"></div>
      <div class="le-legend" id="le-legend">
        <span class="lg lg-green"></span> Natural position
        <span class="lg lg-yellow"></span> Playable
        <span class="lg lg-red"></span> Out of position
      </div>
    </div>
  </div>
</main>

<script src="/static/js/lines.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/context_menu.js"></script>
</body>
</html>
