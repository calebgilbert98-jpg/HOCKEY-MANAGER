<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entry Draft — Puck Dynasty</title>
<link rel="stylesheet" href="/static/css/hub.css">
<link rel="stylesheet" href="/static/css/nav.css">
<link rel="stylesheet" href="/static/css/draft.css">
</head>
<body>
<div class="arena-bg"></div>
{% include '_nav.html' %}

<header class="topbar">
  <a class="back" href="/">← Hub</a>
  <div class="team-sub" id="draft-count"></div>
</header>

<main class="draft-main">
  <div class="bcast-head">
    <div class="bcast-kicker">Draft War Room</div>
    <h1 class="bcast-title" id="draft-title">Entry Draft</h1>
  </div>
  <div class="draft-summary" id="draft-summary"></div>

  <!-- Draft clock + pace (desktop SP clock / pace controls ~7483-7512) -->
  <div class="draft-clockbar" id="draft-clockbar" hidden>
    <div class="clock-box">
      <div class="clock-label">On the clock</div>
      <div class="clock-team" id="clock-team">—</div>
      <div class="clock-time" id="clock-time">—</div>
    </div>
    <div class="pace-box">
      <span class="clock-label">Pace</span>
      <div class="tb-pills" id="pace-pills">
        <button class="tb-pill" data-v="off">⏸ Manual</button>
        <button class="tb-pill" data-v="1x">1×</button>
        <button class="tb-pill" data-v="4x">4×</button>
        <button class="tb-pill" data-v="sim">▶▶ My pick</button>
      </div>
    </div>
  </div>

  <nav class="tb-tabs" id="draft-tabs">
    <button class="tb-tab active" data-tab="board">Draft Board</button>
    <button class="tb-tab" data-tab="available">Available</button>
    <button class="tb-tab" data-tab="shortlist">Shortlist <span class="tab-count" id="shortlist-count"></span></button>
    <button class="tb-tab" data-tab="mypicks">My Picks</button>
    <button class="tb-tab" data-tab="buzz">Buzz</button>
    <button class="tb-tab" data-tab="trades">Trade Feed</button>
    <button class="tb-tab" data-tab="grades">Grades</button>
  </nav>

  <section id="draft-tab-board" class="tb-panel">
    <div class="board" id="board"></div>
  </section>

  <section id="draft-tab-available" class="tb-panel hidden">
    <div class="fa-filters">
      <input class="tb-search" id="av-q" placeholder="Search prospects…">
      <div class="tb-pills" id="av-pos">
        <button class="tb-pill active" data-v="All">All</button>
        <button class="tb-pill" data-v="C">C</button>
        <button class="tb-pill" data-v="W">W</button>
        <button class="tb-pill" data-v="D">D</button>
        <button class="tb-pill" data-v="G">G</button>
      </div>
    </div>
    <div class="draft-actions">
      <button class="tb-btn tb-accent" id="btn-draft-selected" disabled>Draft Selected</button>
      <button class="tb-btn" id="btn-sim-pick">Sim Pick</button>
      <button class="tb-btn" id="btn-scout">Scout Report</button>
      <button class="tb-btn" id="btn-shortlist-add" disabled>+ Shortlist</button>
      <button class="tb-btn" id="btn-trade-pick" hidden>⇄ Trade This Pick</button>
    </div>
    <div class="fa-list" id="available-list"></div>
  </section>

  <section id="draft-tab-shortlist" class="tb-panel hidden">
    <p class="panel-note">Your war-room shortlist — prospects you're watching. Capped at 8.</p>
    <div class="fa-list" id="shortlist-list"></div>
  </section>

  <section id="draft-tab-mypicks" class="tb-panel hidden">
    <div id="mypicks-list"></div>
  </section>

  <section id="draft-tab-buzz" class="tb-panel hidden">
    <div class="buzz-list" id="buzz-list"></div>
  </section>

  <section id="draft-tab-trades" class="tb-panel hidden">
    <div class="trade-list" id="trade-list"></div>
  </section>

  <section id="draft-tab-grades" class="tb-panel hidden">
    <div class="grades-head" id="grades-head"></div>
    <div class="grades-list" id="grades-list"></div>
  </section>
</main>

<!-- Scout report modal -->
<div class="cm-overlay" id="scout-modal" hidden>
  <div class="cm-card" role="dialog" aria-modal="true" style="max-width:560px">
    <div class="cm-head">
      <div><div class="cm-title" id="scout-title">Scout Report</div></div>
      <button class="cm-close" id="scout-close">✕</button>
    </div>
    <div id="scout-body"></div>
  </div>
</div>

<!-- 2-step draft confirm -->
<div class="cm-overlay" id="confirm-modal" hidden>
  <div class="cm-card" role="dialog" aria-modal="true" style="max-width:420px">
    <div class="cm-head"><div class="cm-title">Confirm Draft Pick</div></div>
    <p id="confirm-text"></p>
    <div class="cm-actions">
      <button class="cm-cancel" id="confirm-cancel">Cancel</button>
      <button class="cm-submit" id="confirm-ok">Draft Him</button>
    </div>
  </div>
</div>

<!-- Trade this pick (desktop windows.py ~9785) -->
<div class="cm-overlay" id="tradepick-modal" hidden>
  <div class="cm-card" role="dialog" aria-modal="true" style="max-width:520px">
    <div class="cm-head">
      <div><div class="cm-title">Trade This Pick</div>
      <div class="cm-sub" id="tradepick-sub"></div></div>
      <button class="cm-close" id="tradepick-close">✕</button>
    </div>
    <div id="tradepick-body"></div>
    <div class="cm-actions">
      <button class="cm-cancel" id="tradepick-cancel">Cancel</button>
      <button class="cm-submit" id="tradepick-propose" disabled>Propose Trade</button>
    </div>
  </div>
</div>

<script src="/static/js/draft.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/context_menu.js"></script>
</body>
</html>
