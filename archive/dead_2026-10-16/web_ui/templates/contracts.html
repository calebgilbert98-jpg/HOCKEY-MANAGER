<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contracts — Puck Dynasty</title>
<link rel="stylesheet" href="/static/css/hub.css">
<link rel="stylesheet" href="/static/css/nav.css">
<link rel="stylesheet" href="/static/css/contracts.css">
</head>
<body>
<div class="arena-bg"></div>
{% include '_nav.html' %}

<header class="topbar">
  <a class="back" href="/">← Hub</a>
  <div class="team-sub" id="contracts-count"></div>
</header>

<main class="contracts-main">
  <div class="bcast-head">
    <div class="bcast-kicker">Front Office · Salary Cap</div>
    <h1 class="bcast-title">Contracts</h1>
  </div>
  <p class="contracts-sub" id="cap-line">Roster contracts sorted by cap hit.</p>

  <nav class="tb-tabs" id="contracts-tabs">
    <button class="tb-tab active" data-tab="all">All Contracts</button>
    <button class="tb-tab" data-tab="expiring">Expiring <span class="tb-badge" id="exp-badge"></span></button>
  </nav>
  <div class="contracts-actions">
    <button class="tb-btn tb-accent" id="btn-auto-neg">Auto-Negotiate All Expiring</button>
  </div>

  <div class="contracts-list" id="contracts-list"></div>
</main>

<!-- v2 extension modal (in-page; never a desktop window) -->
<div class="cm-overlay" id="ext-modal" hidden>
  <div class="cm-card" role="dialog" aria-modal="true" aria-labelledby="ext-title">
    <div class="cm-head">
      <div>
        <div class="cm-title" id="ext-title">Contract extension</div>
        <div class="cm-player" id="ext-player">—</div>
      </div>
      <button class="cm-close" id="ext-close" aria-label="Close">✕</button>
    </div>
    <div class="cm-ask" id="ext-ask">—</div>
    <div class="cm-field">
      <label for="ext-years">Term <span class="cm-val" id="ext-years-val">—</span></label>
      <input type="range" id="ext-years" min="1" max="7" step="1" value="4">
    </div>
    <div class="cm-field">
      <label for="ext-aav">AAV (cap hit/yr) <span class="cm-val" id="ext-aav-val">—</span></label>
      <div class="cm-stepper">
        <button class="cm-step" id="ext-aav-down" aria-label="Decrease AAV">−</button>
        <input type="text" id="ext-aav" inputmode="numeric" value="">
        <button class="cm-step" id="ext-aav-up" aria-label="Increase AAV">+</button>
      </div>
      <div class="cm-hint" id="ext-aav-hint">—</div>
    </div>
    <!-- Batch D: clause picker + signing-bonus sweetener (desktop ContractNegotiationView parity) -->
    <div class="cm-field" id="ext-clause-field">
      <label for="ext-clause">Trade protection <span class="cm-val" id="ext-clause-val"></span></label>
      <select id="ext-clause" class="cm-select"></select>
      <div class="cm-hint" id="ext-clause-hint">—</div>
      <div class="cm-field" id="ext-clause-size-field" hidden style="margin-top:6px">
        <label for="ext-clause-size">No-trade list size <span class="cm-val" id="ext-clause-size-val">10 teams</span></label>
        <input type="range" id="ext-clause-size" min="1" max="31" step="1" value="10">
      </div>
    </div>
    <div class="cm-field" id="ext-bonus-field">
      <label for="ext-signing-bonus">Signing bonus <span class="cm-val" id="ext-signing-bonus-val">—</span></label>
      <input type="text" id="ext-signing-bonus" inputmode="numeric" value="0" class="cm-input">
      <div class="cm-hint" id="ext-signing-bonus-hint">Sweetens the offer for the player.</div>
    </div>
    <!-- ELC-only: performance bonus (hidden unless ?elc=1) -->
    <div class="cm-field" id="ext-perf-field" hidden>
      <label for="ext-perf-bonus">Performance bonus <span class="cm-val" id="ext-perf-bonus-val">—</span></label>
      <input type="text" id="ext-perf-bonus" inputmode="numeric" value="0" class="cm-input">
      <div class="cm-hint" id="ext-perf-bonus-hint">—</div>
    </div>
    <div class="cm-field" id="ext-comps-field">
      <div class="panel-label">Comparable contracts</div>
      <div id="ext-comps"><div class="cm-hint">Loading…</div></div>
    </div>
    <div class="cm-cap" id="ext-cap">—</div>
    <div class="cm-note" id="ext-note"></div>
    <div class="cm-actions">
      <button class="cm-cancel" id="ext-cancel">Cancel</button>
      <button class="cm-submit" id="ext-submit" disabled>Extend</button>
    </div>
  </div>
</div>

<!-- v3 multi-day negotiation modal (in-page; never a desktop window) -->
<div class="cm-overlay" id="neg-modal" hidden>
  <div class="cm-card" role="dialog" aria-modal="true" aria-labelledby="neg-title">
    <div class="cm-head">
      <div>
        <div class="cm-title" id="neg-title">Contract negotiation</div>
        <div class="cm-player" id="neg-player">—</div>
      </div>
      <button class="cm-close" id="neg-close" aria-label="Close">✕</button>
    </div>
    <div class="cm-ask" id="neg-ask">—</div>
    <div class="neg-thread" id="neg-thread"></div>
    <div class="cm-field" id="neg-counter-fields" hidden>
      <label for="neg-years">Your counter — term <span class="cm-val" id="neg-years-val">—</span></label>
      <input type="range" id="neg-years" min="1" max="7" step="1" value="4">
      <label for="neg-aav" style="margin-top:10px">Your counter — AAV <span class="cm-val" id="neg-aav-val">—</span></label>
      <div class="cm-stepper">
        <button class="cm-step" id="neg-aav-down" aria-label="Decrease AAV">−</button>
        <input type="text" id="neg-aav" inputmode="numeric" value="">
        <button class="cm-step" id="neg-aav-up" aria-label="Increase AAV">+</button>
      </div>
      <div class="cm-hint">Server re-validates terms (league min/max, term, cap) before sending.</div>
    </div>
    <div class="cm-note" id="neg-note"></div>
    <div class="cm-actions">
      <button class="cm-cancel" id="neg-walk">Walk away</button>
      <button class="cm-cancel" id="neg-counter">Counter</button>
      <button class="cm-submit" id="neg-accept">Accept</button>
    </div>
  </div>
</div>

<script src="/static/js/contracts.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/context_menu.js"></script>
</body>
</html>
