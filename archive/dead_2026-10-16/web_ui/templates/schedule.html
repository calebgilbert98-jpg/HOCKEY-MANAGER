<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule — Puck Dynasty</title>
<link rel="stylesheet" href="/static/css/hub.css">
<link rel="stylesheet" href="/static/css/nav.css">
<link rel="stylesheet" href="/static/css/schedule.css">
</head>
<body>
<div class="arena-bg"></div>
{% include '_nav.html' %}

<header class="topbar">
  <a class="back" href="/">← Hub</a>
  <div class="team-sub" id="sched-count"></div>
</header>

<main class="sched-main">
  <div class="bcast-head">
    <div class="bcast-kicker">Fixtures &amp; Results</div>
    <h1 class="bcast-title">Schedule</h1>
  </div>

  <div class="sched-controls">
    <div class="sched-tabs" role="tablist">
      <button class="sched-tab active" id="tab-mine" role="tab">My Team</button>
      <button class="sched-tab" id="tab-league" role="tab">League</button>
    </div>
    <label class="month-filter">Month:
      <select id="month-select" class="nhl-input">
        <option value="all">All</option>
      </select>
    </label>
  </div>

  <div class="tbl-wrap">
    <table class="sched-table" id="sched-table">
      <thead>
        <tr>
          <th data-sort="date" class="sortable">Date <span class="sort-ind"></span></th>
          <th data-sort="matchup" class="sortable">Matchup <span class="sort-ind"></span></th>
          <th data-sort="score" class="sortable">Score <span class="sort-ind"></span></th>
          <th data-sort="status" class="sortable">Status <span class="sort-ind"></span></th>
          <th class="th-actions">Actions</th>
        </tr>
      </thead>
      <tbody id="sched-body"></tbody>
    </table>
  </div>
  <div class="empty" id="sched-empty" hidden>No games match this filter.</div>
</main>

<script src="/static/js/schedule.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/context_menu.js"></script>
</body>
</html>
